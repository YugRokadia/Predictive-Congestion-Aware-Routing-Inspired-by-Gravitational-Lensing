<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#6ee7ff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="330" rx="18" fill="#070a1c"/>
<text x="600" y="55" text-anchor="middle" fill="#e6ecff" font-size="22" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">End-to-End Pipeline</text>
<text x="600" y="80" text-anchor="middle" fill="#7d8bb8" font-size="13" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Data  →  Forecasting  →  Potential-field Routing   (all stages share the GEANT2 graph G=(V,E))</text>
<path id="p" d="M20,185 H1180" stroke="url(#fl)" stroke-width="2" stroke-dasharray="6 8" opacity=".6"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path>
<g><rect x="20" y="110" width="160" height="150" rx="14" fill="#0d1330" stroke="#6ee7ff" stroke-opacity=".5" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="6s" begin="0s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;3;1.5" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
<circle cx="44" cy="138" r="14" fill="#6ee7ff" fill-opacity=".2" stroke="#6ee7ff"/><text x="44" y="143" text-anchor="middle" fill="#6ee7ff" font-size="14" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">1</text>
<text x="100" y="195" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Traffic Sim</text>
<text x="100" y="217" text-anchor="middle" fill="#9fb0e0" font-size="12" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">BNNetSim · Docker</text>
<text x="100" y="244" text-anchor="middle" fill="#6ee7ff" font-size="12" font-family="'SF Mono',Consolas,'Courier New',monospace">300 steps, 5 cycles</text></g><g><rect x="220" y="110" width="160" height="150" rx="14" fill="#0d1330" stroke="#6ee7ff" stroke-opacity=".5" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;3;1.5" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
<circle cx="244" cy="138" r="14" fill="#6ee7ff" fill-opacity=".2" stroke="#6ee7ff"/><text x="244" y="143" text-anchor="middle" fill="#6ee7ff" font-size="14" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">2</text>
<text x="300" y="195" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Congestion ρ</text>
<text x="300" y="217" text-anchor="middle" fill="#9fb0e0" font-size="12" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Σ link loads / node</text>
<text x="300" y="244" text-anchor="middle" fill="#6ee7ff" font-size="12" font-family="'SF Mono',Consolas,'Courier New',monospace">ρᵢ(t)=Σ L_e(t)</text></g><g><rect x="420" y="110" width="160" height="150" rx="14" fill="#0d1330" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;3;1.5" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
<circle cx="444" cy="138" r="14" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa"/><text x="444" y="143" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">3</text>
<text x="500" y="195" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">PI-ST-GNN</text>
<text x="500" y="217" text-anchor="middle" fill="#9fb0e0" font-size="12" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">2×GCN → GRU(64)</text>
<text x="500" y="244" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="'SF Mono',Consolas,'Courier New',monospace">ρ̂ₜ₊₁ = ρₜ + Δρ̂</text></g><g><rect x="620" y="110" width="160" height="150" rx="14" fill="#0d1330" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="6s" begin="3s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;3;1.5" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
<circle cx="644" cy="138" r="14" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa"/><text x="644" y="143" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">4</text>
<text x="700" y="195" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Poisson Field</text>
<text x="700" y="217" text-anchor="middle" fill="#9fb0e0" font-size="12" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Discrete graph solve</text>
<text x="700" y="244" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="'SF Mono',Consolas,'Courier New',monospace">LΦ = kρ̂</text></g><g><rect x="820" y="110" width="160" height="150" rx="14" fill="#0d1330" stroke="#f0abfc" stroke-opacity=".5" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="6s" begin="4s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;3;1.5" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
<circle cx="844" cy="138" r="14" fill="#f0abfc" fill-opacity=".2" stroke="#f0abfc"/><text x="844" y="143" text-anchor="middle" fill="#f0abfc" font-size="14" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">5</text>
<text x="900" y="195" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Curved Cost</text>
<text x="900" y="217" text-anchor="middle" fill="#9fb0e0" font-size="12" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Lensing-inspired</text>
<text x="900" y="244" text-anchor="middle" fill="#f0abfc" font-size="12" font-family="'SF Mono',Consolas,'Courier New',monospace">w = 1+α(Φᵤ+Φᵥ)/2</text></g><g><rect x="1020" y="110" width="160" height="150" rx="14" fill="#0d1330" stroke="#f0abfc" stroke-opacity=".5" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="6s" begin="5s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1.5;3;1.5" dur="6s" begin="5s" repeatCount="indefinite"/></rect>
<circle cx="1044" cy="138" r="14" fill="#f0abfc" fill-opacity=".2" stroke="#f0abfc"/><text x="1044" y="143" text-anchor="middle" fill="#f0abfc" font-size="14" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">6</text>
<text x="1100" y="195" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Route</text>
<text x="1100" y="217" text-anchor="middle" fill="#9fb0e0" font-size="12" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">Weighted Dijkstra</text>
<text x="1100" y="244" text-anchor="middle" fill="#f0abfc" font-size="12" font-family="'SF Mono',Consolas,'Courier New',monospace">P* = argmin Σ w</text></g>
<circle r="7" fill="#fff" filter="url(#g)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
<circle r="14" fill="#a78bfa" opacity=".35"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
<text x="600" y="305" text-anchor="middle" fill="#7d8bb8" font-size="12" font-family="'SF Mono',Consolas,'Courier New',monospace">L_phys = (1/N) Σ (Δρ̂ + αLρ)²    ·    L_total = MSE + λ_phys · L_phys</text>
</svg>